name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CODEXGPT_BRIDGE_UPDATE_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/release-manifest.json

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        run: node -e "const p=require('./package.json'); if (process.env.GITHUB_REF_NAME !== 'v'+p.version) { throw new Error('Tag must equal v'+p.version); }"
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm i18n:check
      - run: pnpm secret:scan
      - run: pnpm test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm secret:scan
      - run: pnpm package:win
      - run: node scripts/desktop-online-update-e2e.mjs "--executable=${{ github.workspace }}/release/win-unpacked/CodexGPT Bridge.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            release/CodexGPT-Bridge-Setup-*.exe
            release/CodexGPT-Bridge-Setup-*.exe.blockmap

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: macos-14
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm secret:scan
      - run: pnpm package:mac:${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/CodexGPT-Bridge-*-*.dmg
            release/CodexGPT-Bridge-*-*.zip

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm secret:scan
      - run: pnpm package:linux:${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/CodexGPT-Bridge-*-*.AppImage
            release/CodexGPT-Bridge-*-*.deb

  publish:
    needs: [validate, windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Verify tag matches package version
        run: node -e "const p=require('./package.json'); if (process.env.GITHUB_REF_NAME !== 'v'+p.version) { throw new Error('Tag must equal v'+p.version); }"
      - name: Generate release manifest
        run: node scripts/generate-release-manifest.mjs --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/"
      - name: Verify release manifest
        run: node scripts/verify-release-manifest.mjs --require-complete
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --draft
          fi
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release/* --clobber
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
